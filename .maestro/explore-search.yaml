# Explore Screen Search Test
# Tests: Navigate to source, search, cancel search

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to Sources
- tapOn:
    text: "Sources"
- waitForAnimationToEnd
- takeScreenshot: explore_01_sources

# Tap on Test source to enter browse mode
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: explore_02_source_selected

# Tap search icon using accessibility text
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- takeScreenshot: explore_03_search_mode

# Type search query
- inputText: "fantasy"
- takeScreenshot: explore_04_query_entered

# Execute search
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: explore_05_search_results

# Cancel search (tap back button)
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- takeScreenshot: explore_06_search_cancelled

- takeScreenshot: explore_07_complete
