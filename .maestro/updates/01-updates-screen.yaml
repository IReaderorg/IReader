# Updates Feature: Screen Tests
# Tests: Updates tab, update list

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Test 1: Navigate to Updates tab
- tapOn:
    text: "Updates"
- waitForAnimationToEnd
- takeScreenshot: updates_01_tab

# Test 2: Verify screen loads
- takeScreenshot: updates_02_screen_state

# Test 3: Check for empty state or updates
- takeScreenshot: updates_03_content

# Test 4: Navigate away and back
- tapOn:
    text: "Library"
- waitForAnimationToEnd
- tapOn:
    text: "Updates"
- waitForAnimationToEnd
- takeScreenshot: updates_04_navigate_back
