# Explore Feature: Error Handling Tests
# Tests: Error states, retry, broken source handling

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to Sources
- tapOn:
    text: "Sources"
- waitForAnimationToEnd

# Test 1: Verify sources list loads
- assertVisible:
    text: "Test source"
- takeScreenshot: error_01_sources_loaded

# Test 2: Select source and verify it loads
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: error_02_source_loaded

# Test 3: Verify books are displayed
- assertVisible:
    text: "Fantasy Adventure"
- takeScreenshot: error_03_books_displayed

# Test 4: Test search with no results
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- inputText: "zzzznonexistent"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: error_04_no_results

# Test 5: Verify "No result Found" message
- assertVisible:
    text: "No result Found"
- takeScreenshot: error_05_no_results_message

# Test 6: Clear search and verify recovery
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- takeScreenshot: error_06_recovered

# Test 7: Verify books are still visible
- assertVisible:
    text: "Fantasy Adventure"
- takeScreenshot: error_07_recovery_verified
