# Explore Feature: Source Navigation Tests
# Tests: Navigate to sources, select source, verify browse mode

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Test 1: Navigate to Sources tab
- tapOn:
    text: "Sources"
- waitForAnimationToEnd
- takeScreenshot: explore_01_sources_tab

# Verify sources list is visible
- assertVisible:
    text: "Test source"
- takeScreenshot: explore_02_sources_visible

# Test 2: Select Test source
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: explore_03_source_selected

# Verify we're in browse mode - should see book grid
- assertVisible:
    text: "Fantasy Adventure"
- takeScreenshot: explore_04_browse_mode

# Test 3: Go back to sources list
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- takeScreenshot: explore_05_back_to_sources

# Verify we're back at sources list
- assertVisible:
    text: "Test source"
- takeScreenshot: explore_06_sources_list_verified
