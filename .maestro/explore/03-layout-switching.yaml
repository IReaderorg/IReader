# Explore Feature: Layout Switching Tests
# Tests: Grid/List views, layout selector

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to Test source
- tapOn:
    text: "Sources"
- waitForAnimationToEnd
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000

# Test 1: Verify default grid layout
- takeScreenshot: layout_01_default_grid

# Test 2: Open layout selector
- tapOn:
    text: "Layout"
- waitForAnimationToEnd
- takeScreenshot: layout_02_selector_open

# Test 3: Switch to list layout
- tapOn:
    text: "List"
- waitForAnimationToEnd
- takeScreenshot: layout_03_list_view

# Test 4: Verify list layout is applied
- assertVisible:
    text: "Fantasy Adventure"
- takeScreenshot: layout_04_list_verified

# Test 5: Switch back to grid
- tapOn:
    text: "Layout"
- waitForAnimationToEnd
- tapOn:
    text: "Comfortable Grid"
- waitForAnimationToEnd
- takeScreenshot: layout_05_grid_restored

# Test 6: Test compact grid
- tapOn:
    text: "Layout"
- waitForAnimationToEnd
- tapOn:
    text: "Compact Grid"
- waitForAnimationToEnd
- takeScreenshot: layout_06_compact_grid

# Test 7: Test cover only
- tapOn:
    text: "Layout"
- waitForAnimationToEnd
- tapOn:
    text: "Cover Only"
- waitForAnimationToEnd
- takeScreenshot: layout_07_cover_only
