# Explore Feature: Back Navigation Tests
# Tests: Various back navigation paths

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to Test source
- tapOn:
    text: "Sources"
- waitForAnimationToEnd
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000

# Test 1: Verify we're in source
- assertVisible:
    text: "Fantasy Adventure"
- takeScreenshot: nav_01_in_source

# Test 2: Go back using back button
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- takeScreenshot: nav_02_back_to_sources

# Test 3: Verify we're back at sources
- assertVisible:
    text: "Test source"
- takeScreenshot: nav_03_sources_verified

# Test 4: Navigate to source again
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000

# Test 5: Use system back
- pressKey: Back
- waitForAnimationToEnd
- takeScreenshot: nav_04_system_back

# Test 6: Navigate to different tab
- tapOn:
    text: "Library"
- waitForAnimationToEnd
- takeScreenshot: nav_05_library_tab

# Test 7: Return to Sources
- tapOn:
    text: "Sources"
- waitForAnimationToEnd
- takeScreenshot: nav_06_back_to_sources_tab
