# Explore Feature: Search Edge Cases Tests
# Tests: Special characters, empty query, rapid typing

appId: ir.kazemcodes.infinityreader.debug
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to Test source
- tapOn:
    text: "Sources"
- waitForAnimationToEnd
- tapOn:
    text: "Test source"
- waitForAnimationToEnd:
    timeout: 10000

# Test 1: Search with uppercase
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- inputText: "FANTASY"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: edge_01_uppercase

# Verify results appear (case-insensitive)
- assertVisible:
    text: "Fantasy Adventure"
- takeScreenshot: edge_02_uppercase_results

# Test 2: Clear and try partial match
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- inputText: "fan"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: edge_03_partial_match

# Test 3: Single character search
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- inputText: "a"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: edge_04_single_char

# Test 4: Very long query
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- inputText: "thisisaverylongsearchquerythatshouldnotmatchanything"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: edge_05_long_query

# Test 5: Special characters
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- tapOn:
    text: "Search"
- waitForAnimationToEnd
- inputText: "!@#$%"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: edge_06_special_chars

# Clean up - go back
- tapOn:
    point: "8%,8%"
- waitForAnimationToEnd
- takeScreenshot: edge_07_cleanup
