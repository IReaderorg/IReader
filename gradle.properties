# Project-wide Gradle settings.
# MACHINE-SPECIFIC: Create gradle.properties.local to override for your machine.
# IDE (e.g. Android Studio) users: IDE settings override this file.

# Gradle daemon memory - tuned for 16-32GB RAM machines
# For 16GB machines: -Xmx4096m, for 32GB: -Xmx6144m
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:ReservedCodeCacheSize=256m

# Kotlin daemon memory (separate process, shares code cache)
# 2g is too low for :presentation compilation (OOM during gradle test); 4g keeps the suite green
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC

# Parallel builds
org.gradle.parallel=true

# Gradle daemon
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.daemon.idletimeout=10800000

# Workers = CPU cores - 2 (adjust for your machine)
org.gradle.workers.max=8

# AndroidX
android.enableJetifier=false
android.useAndroidX=true

# Kotlin
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.multiplatform=true
kotlin.caching.enabled=true
kotlin.compiler.execution.strategy=daemon
android.disallowKotlinSourceSets=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Kotlin MPP
kotlin.mpp.stability.nowarn=true
suppressKotlinVersionCompatibilityCheck=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Build config
buildkonfig.flavor=dev

# Configuration cache
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true

# Android build optimizations
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Android build features
android.useFullClasspathForDexingTransform=true

# Build cache
org.gradle.caching=true

# Kotlin build report
kotlin.build.report.output=file

# Skip i18n git commands during dev builds (add to gradle.properties.local)
# skipI18n=true

# Detekt: skip during dev builds (run ./gradlew detekt separately)
# Set to true in CI: SKIP_DETEKT=false ./gradlew build
SKIP_DETEKT=true

# Skip tests during dev builds (run ./gradlew test separately)
# Set to false in CI: SKIP_TESTS=false ./gradlew build
SKIP_TESTS=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
